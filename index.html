<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div id="app-navbar" data-base=""></div>

    <div class="container py-4">
        <h2 class="mb-4">Eventos Disponibles</h2>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Conferencia de Tecnología</h5>
                        <p class="card-text text-muted">Edición 2026 · 15 de marzo</p>
                        <a href="pantallas/asistente/detallesEdicion.html" class="btn btn-outline-primary">Ver Detalle</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Feria de Emprendimiento</h5>
                        <p class="card-text text-muted">Edición 2026 · 2 de abril</p>
                        <a href="pantallas/asistente/detallesEdicion.html" class="btn btn-outline-primary">Ver Detalle</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Taller de Diseño UX</h5>
                        <p class="card-text text-muted">Edición 2026 · 20 de abril</p>
                        <a href="pantallas/asistente/detallesEdicion.html" class="btn btn-outline-primary">Ver Detalle</a>
                    </div>
                </div>
            </div>
        </div>

        <div id="login-container" class="d-none mt-5">
            <div class="card shadow-sm mx-auto" style="width: 400px;">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Iniciar Sesión</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" placeholder="••••••••">
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="button" id="btn-login-asistente" class="btn btn-outline-primary w-50">Entrar como
                                Asistente</button>
                            <button type="button" id="btn-login-organizador" class="btn btn-primary w-50">Entrar como
                                Organizador</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/common/navbar.js"></script>
    <script src="scripts/index.js"></script>
</body>

</html>
