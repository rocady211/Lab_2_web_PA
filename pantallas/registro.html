<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="app-navbar" data-base="../"></div>

    <div class="container py-4">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Crear Cuenta</h2>

                <div id="registro-error" class="alert alert-danger d-none" role="alert"></div>

                <form id="form-registro" novalidate>
                    <div class="mb-3">
                        <label class="form-label d-block">Registrarme como</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipo" id="tipo-asistente" value="asistente" checked>
                            <label class="form-check-label" for="tipo-asistente">Asistente</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipo" id="tipo-organizador" value="organizador">
                            <label class="form-check-label" for="tipo-organizador">Organizador</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="nickname">Nickname</label>
                        <input type="text" class="form-control" id="nickname" required>
                        <div class="invalid-feedback" id="nickname-feedback">Ingresá un nickname.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                        <div class="invalid-feedback">Ingresá tu nombre.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="correo">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" required>
                        <div class="invalid-feedback" id="correo-feedback">Ingresá un correo válido.</div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="contrasena">Contraseña</label>
                            <input type="password" class="form-control" id="contrasena" required>
                            <div class="invalid-feedback">Ingresá una contraseña.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="confirmacion">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmacion" required>
                            <div class="invalid-feedback" id="confirmacion-feedback">Confirmá la contraseña.</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="imagen">Imagen <span class="text-muted">(opcional)</span></label>
                        <input type="file" class="form-control" id="imagen" accept="image/*">
                        <div class="invalid-feedback" id="imagen-feedback"></div>
                    </div>

                    <div id="campos-asistente">
                        <div class="mb-3">
                            <label class="form-label" for="apellido">Apellido</label>
                            <input type="text" class="form-control" id="apellido" required>
                            <div class="invalid-feedback">Ingresá tu apellido.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="fecha-nacimiento">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="fecha-nacimiento" required>
                            <div class="invalid-feedback">Ingresá tu fecha de nacimiento.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="institucion">Institución <span class="text-muted">(opcional)</span></label>
                            <select class="form-select" id="institucion">
                                <option value="">Ninguna</option>
                            </select>
                        </div>
                    </div>

                    <div id="campos-organizador" class="d-none">
                        <div class="mb-3">
                            <label class="form-label" for="descripcion">Descripción general</label>
                            <textarea class="form-control" id="descripcion" rows="3" required disabled></textarea>
                            <div class="invalid-feedback">Ingresá una descripción.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="sitio-web">Sitio web <span class="text-muted">(opcional)</span></label>
                            <input type="url" class="form-control" id="sitio-web" placeholder="https://" disabled>
                            <div class="invalid-feedback">Ingresá un enlace válido (ej: https://misitio.com).</div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <a href="../index.html" class="btn btn-outline-secondary w-50">Cancelar</a>
                        <button type="submit" class="btn btn-primary w-50">Registrarme</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/common/navbar.js"></script>
    <script src="../scripts/common/usuarios.js"></script>
    <script src="../scripts/registro.js"></script>
</body>
</html>
