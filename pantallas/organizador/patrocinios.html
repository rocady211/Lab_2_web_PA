<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrocinios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="app-navbar" data-base="../../"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Patrocinios</h2>
            <button class="btn btn-primary">Nuevo Patrocinio</button>
        </div>

        <table class="table table-striped bg-white">
            <thead>
                <tr>
                    <th>Patrocinador</th>
                    <th>Evento</th>
                    <th>Monto</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>TechCorp</td>
                    <td>Conferencia de Tecnología</td>
                    <td>$5.000.000</td>
                    <td><span class="badge bg-success">Confirmado</span></td>
                </tr>
                <tr>
                    <td>InnovaBank</td>
                    <td>Feria de Emprendimiento</td>
                    <td>$2.000.000</td>
                    <td><span class="badge bg-warning text-dark">Pendiente</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/common/navbar.js"></script>
    <script src="../../scripts/organizador/patrocinios.js"></script>
</body>
</html>
