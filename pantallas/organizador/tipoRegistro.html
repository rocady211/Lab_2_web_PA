<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="app-navbar" data-base="../../"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Tipos de Registro</h2>
            <button class="btn btn-primary">Nuevo Tipo</button>
        </div>

        <table class="table table-striped bg-white">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Cupos</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>General</td>
                    <td>$50.000</td>
                    <td>150</td>
                </tr>
                <tr>
                    <td>VIP</td>
                    <td>$120.000</td>
                    <td>50</td>
                </tr>
                <tr>
                    <td>Estudiante</td>
                    <td>$20.000</td>
                    <td>100</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/common/navbar.js"></script>
    <script src="../../scripts/organizador/tipoRegistro.js"></script>
</body>
</html>
